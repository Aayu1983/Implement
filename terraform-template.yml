name: Terraform Deployment Template

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      client_id:
        required: true
        type: string
      subscription_id:
        required: true
        type: string
      tenant_id:
        required: true
        type: string
      # Backend configuration inputs
      resource_group_name:
        required: true
        type: string
      storage_account_name:
        required: true
        type: string
      container_name:
        required: true
        type: string
      tf_state_key:
        required: true
        type: string

jobs:
  terraform-plan:
    name: Terraform Plan (${{ inputs.environment }})
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.client_id }}
          tenant-id: ${{ inputs.tenant_id }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Terraform Init
        shell: powershell
        run: |
          # Yaha backend configuration dynamic pass ho rahi hai
          terraform init `
            -backend-config="resource_group_name=${{ inputs.resource_group_name }}" `
            -backend-config="storage_account_name=${{ inputs.storage_account_name }}" `
            -backend-config="container_name=${{ inputs.container_name }}" `
            -backend-config="key=${{ inputs.tf_state_key }}"

      - name: Terraform Plan
        shell: powershell
        run: |
          terraform plan -out=tfplan

      - name: Notify Plan Details
        shell: powershell
        run: |
          Write-Host "🚀 Notification: Plan for ${{ inputs.environment }} executed by ${{ github.actor }}"

  terraform-apply:
    name: Terraform Apply (${{ inputs.environment }})
    needs: terraform-plan
    runs-on: windows-latest
    environment: ${{ inputs.environment }} # Approval yaha aayega
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.client_id }}
          tenant-id: ${{ inputs.tenant_id }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Terraform Init (Apply Stage)
        shell: powershell
        run: |
          terraform init `
            -backend-config="resource_group_name=${{ inputs.resource_group_name }}" `
            -backend-config="storage_account_name=${{ inputs.storage_account_name }}" `
            -backend-config="container_name=${{ inputs.container_name }}" `
            -backend-config="key=${{ inputs.tf_state_key }}"

      - name: Terraform Apply
        shell: powershell
        run: |
          terraform apply -auto-approve