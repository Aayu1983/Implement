name: Terraform Deployment Template

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      client_id:
        required: true
        type: string
      subscription_id:
        required: true
        type: string
      tenant_id:
        required: true
        type: string
      # Backend configuration inputs
      resource_group_name:
        required: true
        type: string
      storage_account_name:
        required: true
        type: string
      container_name:
        required: true
        type: string
      tf_state_key:
        required: true
        type: string

jobs:
  terraform-plan:
    name: Terraform Plan (${{ inputs.environment }})
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.client_id }}
          tenant-id: ${{ inputs.tenant_id }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Terraform Init
        shell: powershell
        run: terraform init -backend-config="..." # (aapke backend details)

      # --- BINARY GENERATION ---
      - name: Create Binary Plan
        id: plan
        shell: powershell
        run: |
          # '-out' flag se binary file 'tfplan' banti hai
          terraform plan -out=tfplan -input=false
          
          # Binary ka SHA nikalna (Integrity check ke liye)
          $sha = (Get-FileHash tfplan -Algorithm SHA256).Hash
          echo "PLAN_SHA=$sha" >> $env:GITHUB_ENV
          Write-Host "Binary Plan SHA: $sha"

      # --- NOTIFICATION (No Approval Here) ---
      - name: Notify Plan Details
        shell: powershell
        run: |
          Write-Host "📢 Notification: Binary Plan generated for ${{ inputs.environment }} by ${{ github.actor }}"
          Write-Host "SHA Signature: ${{ env:PLAN_SHA }}"

      # --- BINARY ARTIFACT UPLOAD ---
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-binary-${{ inputs.environment }}
          path: tfplan
          retention-days: 1

  terraform-apply:
    name: Terraform Apply (${{ inputs.environment }})
    needs: terraform-plan
    runs-on: windows-latest
    environment: ${{ inputs.environment }} # YAHAN APPROVAL AAYEGA
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BINARY DOWNLOAD ---
      - name: Download Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-binary-${{ inputs.environment }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.client_id }}
          tenant-id: ${{ inputs.tenant_id }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Terraform Init
        shell: powershell
        run: terraform init -backend-config="..."

      # --- BINARY APPLY ---
      - name: Terraform Apply Binary
        shell: powershell
        run: |
          # Yahan hum koi configuration file nahi, sirf binary file (tfplan) use kar rahe hain
          # Isse "Configuration drift" ka khatra nahi rehta
          terraform apply -auto-approve tfplan
