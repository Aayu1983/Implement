name: Multi-Env Infra Pipeline

on:
  push:
    branches:
      - main

jobs:
  # SIT Environment
  SIT-Deployment:
    uses: ./.github/workflows/terraform-template.yml
    with:
      environment: 'SIT'
      client_id: 'SIT_APP_ID'
      subscription_id: 'SUBSCRIPTION_ID'
      tenant_id: 'TENANT_ID'

  # UAT Environment
  UAT-Deployment:
    needs: SIT-Deployment
    uses: ./.github/workflows/terraform-template.yml
    with:
      environment: 'UAT'
      client_id: 'UAT_APP_ID'
      subscription_id: 'SUBSCRIPTION_ID'
      tenant_id: 'TENANT_ID'

  # Production Environment
  Production-Deployment:
    needs: UAT-Deployment
    uses: ./.github/workflows/terraform-template.yml
    with:
      environment: 'Production'
      client_id: 'PROD_APP_ID'
      subscription_id: 'SUBSCRIPTION_ID'
      tenant_id: 'TENANT_ID'

  # DR-Hub Environment
  DRHub-Deployment:
    needs: Production-Deployment
    uses: ./.github/workflows/terraform-template.yml
    with:
      environment: 'DRHub'
      client_id: 'DR_APP_ID'
      subscription_id: 'SUBSCRIPTION_ID'
      tenant_id: 'TENANT_ID'