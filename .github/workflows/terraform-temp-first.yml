name: Terraform Deployment Template multi

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      working_directory:
        required: false
        type: string
        default: '.'
      tf_state_key:
        required: true
        type: string
    secrets:
      client_id:
        required: true
      subscription_id:
        required: true
      tenant_id:
        required: true
      resource_group_name:
        required: true
      storage_account_name:
        required: true
      container_name:
        required: true

jobs:
  setup:
    name: "Environment Initialization"
    runs-on: [self-hosted, Windows]
    outputs:
      selected_branch: ${{ steps.determine_branch.outputs.branch }}
    steps:
      - name: Evaluate Environment Branch Rule
        id: determine_branch
        shell: powershell
        run: |
          $env_input = "${{ inputs.environment }}".ToLower()
          if ($env_input -eq "production" -or $env_input -eq "drhub") {
              $branch = "main"
          } else {
              $branch = $env_input
          }
          echo "branch=$branch" >> $env:GITHUB_OUTPUT
          
  infrastructure-validation:
    name: "Plan - ${{ inputs.environment }}"
    needs: setup
    environment: ${{ inputs.environment }}-plan
    runs-on: [self-hosted, Windows]
    outputs:
      plan_commit_sha: ${{ steps.capture_sha.outputs.sha }} # Fix: Mapping SHA to job output
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: powershell
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.selected_branch }}

      - name: Capture Exact Commit SHA
        id: capture_sha
        shell: powershell
        run: |
          $sha = (git rev-parse HEAD).Trim()
          echo "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.client_id }}
          tenant-id: ${{ secrets.tenant_id }}
          subscription-id: ${{ secrets.subscription_id }}

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.client_id }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.subscription_id }}
          ARM_TENANT_ID: ${{ secrets.tenant_id }}
          ARM_USE_OIDC: true
        run: |
          terraform init `
            -backend-config="resource_group_name=${{ secrets.resource_group_name }}" `
            -backend-config="storage_account_name=${{ secrets.storage_account_name }}" `
            -backend-config="container_name=${{ secrets.container_name }}" `
            -backend-config="key=${{ inputs.tf_state_key }}"

      - name: Create Binary Plan
        env:
          ARM_CLIENT_ID: ${{ secrets.client_id }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.subscription_id }}
          ARM_TENANT_ID: ${{ secrets.tenant_id }}
          ARM_USE_OIDC: true
        run: terraform plan -out=tfplan -input=false

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-binary-${{ inputs.environment }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 1
          
  deployment-gatekeeper:
    needs: [setup,  infrastructure-validation]
    uses: ./.github/workflows/approval-template.yml 
    with:
      environment: ${{ inputs.environment }}
      requestor: ${{ github.actor }}

  infrastructure-deployment:    
    name: "Apply - ${{ inputs.environment }}"
    needs: [infrastructure-validation, deployment-gatekeeper]
    runs-on: [self-hosted, Windows]
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: powershell
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.terraform-plan.outputs.plan_commit_sha }} # Now this will work

      - name: Download Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-binary-${{ inputs.environment }}
          path: ${{ inputs.working_directory }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.client_id }}
          tenant-id: ${{ secrets.tenant_id }}
          subscription-id: ${{ secrets.subscription_id }}

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.client_id }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.subscription_id }}
          ARM_TENANT_ID: ${{ secrets.tenant_id }}
          ARM_USE_OIDC: true
        run: |
          terraform init `
            -backend-config="resource_group_name=${{ secrets.resource_group_name }}" `
            -backend-config="storage_account_name=${{ secrets.storage_account_name }}" `
            -backend-config="container_name=${{ secrets.container_name }}" `
            -backend-config="key=${{ inputs.tf_state_key }}"

      - name: Terraform Apply Binary
        env:
          ARM_CLIENT_ID: ${{ secrets.client_id }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.subscription_id }}
          ARM_TENANT_ID: ${{ secrets.tenant_id }}
          ARM_USE_OIDC: true
        run: terraform apply -auto-approve tfplan
